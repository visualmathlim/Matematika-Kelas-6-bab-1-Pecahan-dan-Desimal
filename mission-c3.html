<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission C3: Pecahan ÷ Pecahan | VisualMath.Lim</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --royal:#2563eb; --royal-dk:#1e40af; --bg:#eef2fb; --card:#ffffff; --ink:#0f172a;
    --line:#dbe3f5; --teal:#0d9488; --gold:#ca8a04; --gold-bg:#f4b400; --green-dk:#0f766e; --red:#dc2626;
  }
  body{ background-color:var(--bg); color:var(--ink); font-family:'Segoe UI',Tahoma,Verdana,sans-serif; }
  .card{ background-color:var(--card); border:1px solid var(--line); box-shadow:0 1px 4px rgba(30,64,175,.06); }
  .path-line{ position:absolute; top:32px; bottom:32px; left:32px; width:4px; background:linear-gradient(var(--royal),var(--gold-bg)); z-index:0; }
  .node{ position:relative; z-index:1; }
  .node-dot{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:800; border:3px solid var(--line); background:var(--card); flex:none; color:var(--royal); }
  .node.active .node-dot{ border-color:var(--gold-bg); box-shadow:0 0 0 4px rgba(244,180,0,.25); color:var(--gold); }
  .node.done .node-dot{ border-color:var(--royal); background:var(--royal); color:#fff; }
  .node.locked .node-dot{ opacity:.5; }
  .avatar{ width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid var(--gold-bg); background:#fff; }
  .math-frac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .2rem; font-weight:bold; line-height:1.1; font-size:.9em; }
  .math-num{ border-bottom:2px solid currentColor; padding:0 .3rem; width:100%; text-align:center; }
  .math-den{ padding:0 .3rem; width:100%; text-align:center; }
  .home-btn{ display:flex; align-items:center; gap:6px; font-size:0.9rem; font-weight:700; color:var(--royal-dk); background:#dbe3f5; padding:6px 14px; border-radius:99px; transition:all 0.2s; }
  .home-btn:hover{ background:var(--royal); color:#fff; }
</style>
</head>
<body class="antialiased min-h-screen">

<header class="card border-b sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="assets/logo.png" alt="VisualMath.Lim" class="h-10 w-auto" onerror="this.outerHTML='<div class=\'h-10 w-10 bg-blue-800 rounded-full flex items-center justify-center font-bold text-amber-400\'>VM</div>'">
      <div>
        <h1 class="text-lg font-bold" style="color:var(--royal)">VisualMath.Lim</h1>
        <p class="text-[11px] text-slate-500">Math Mastery • Kelas 6</p>
      </div>
    </div>
    <a href="index.html" class="home-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Home</span>
    </a>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-10 space-y-8">

  <section class="text-center space-y-2">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-sm border font-semibold" style="border-color:var(--royal); background:#e8eefc; color:var(--royal-dk)">🧩 Mission C3</div>
    <h2 class="text-3xl font-extrabold" style="color:var(--royal-dk)">Pecahan ÷ Pecahan</h2>
    <p class="text-2xl font-bold" style="color:var(--gold)">
      <span class="math-frac"><span class="math-num">3</span><span class="math-den">4</span></span> ÷
      <span class="math-frac"><span class="math-num">3</span><span class="math-den">8</span></span> = ?
    </p>
    <p class="max-w-md mx-auto text-sm text-slate-600">Big Idea: <i>"Berapa banyak potongan kecil yang termuat di dalam potongan besar?"</i></p>
  </section>

  <section class="relative py-2">
    <div class="path-line"></div>
    <div id="nodes" class="space-y-8"></div>
  </section>

  <section class="card rounded-2xl p-6 text-center space-y-3">
    <p class="text-sm text-slate-600">Selesaikan semua pos untuk membuka:</p>
    <p class="text-xl font-bold" style="color:var(--gold)">🏅 Fraction Grouper Master Badge</p>
    <div>
      <a id="cta" href="mission-c3-pos1-brief.html" class="inline-block font-bold py-3 px-8 rounded-full text-white shadow-lg transition-transform hover:-translate-y-0.5" style="background:var(--royal)">Mulai Misi ➔</a>
    </div>
    <p class="pt-2"><a href="index.html" class="text-xs text-slate-500 hover:text-slate-800 font-semibold">🏠 Kembali ke Home Utama</a></p>
  </section>

</main>

<script>
function readLog(key){ try{ return JSON.parse(localStorage.getItem(key)) || {passed:false}; }catch(e){ return {passed:false}; } }
let progress = 0;
try{ progress = +localStorage.getItem('vm_c3_progress') || 0; }catch(e){}
const log6 = readLog('vm_c3_pos6'), log7 = readLog('vm_c3_pos7');

const NODES = [
  {t:'Mission Brief', s:'Pita Luna & kalibrasi mini', img:'Pixel', href:'mission-c3-pos1-brief.html'},
  {t:'See — Taksir & Potong Pita', s:'Taksir dulu, lalu potong bertahap', img:'Luna', href:'mission-c3-pos2-see.html'},
  {t:'Visualize — Lab Grouping', s:'Bar dipotong-potong + Mode Eksperimen', img:'Luna', href:'mission-c3-pos3-visualize.html'},
  {t:'Think & Discover', s:'Menemukan pola + game + Pixel Alert', img:'Kian', href:'mission-c3-pos4-discover.html'},
  {t:'Skill Unlock', s:'Bar Model, Samakan Penyebut, KCF', img:'Sigma', href:'mission-c3-pos5-skillunlock.html'},
  {t:'Quest', s:'Kuis KKM 70', img:'Kian', href:'mission-c3-pos6-quiz.html'},
  {t:'Boss Battle', s:'Soal HOTS bersisa', img:'Kian', href:'mission-c3-pos7-boss.html'},
  {t:'Mission Log & Badge', s:'Refleksi + badge', img:'Sigma', href:'mission-c3-pos8-log.html'}
];
function isDone(n){
  if(n<=5) return n<=progress;
  if(n===6) return !!log6.passed;
  if(n===7) return !!log7.passed;
  return !!(log6.passed && log7.passed);
}
let activeIdx = NODES.findIndex((_,i)=>!isDone(i+1));
const wrap = document.getElementById('nodes');
NODES.forEach((nd,i)=>{
  const n = i+1, done = isDone(n);
  const state = done ? 'done' : (i===activeIdx ? 'active' : 'locked');
  const div = document.createElement('div');
  div.className = `node ${state} flex items-center gap-4`;
  div.innerHTML = `<div class="node-dot">${done ? '✓' : n}</div>
    <a href="${nd.href}" class="card rounded-xl px-4 py-3 flex-1 flex items-center justify-between hover:border-blue-400 transition-colors">
      <div><p class="font-bold">${nd.t}</p><p class="text-xs text-slate-500">${nd.s}</p></div>
      <img src="assets/${nd.img}.png" alt="${nd.img}" class="avatar" onerror="this.outerHTML='<div class=\'avatar flex items-center justify-center font-bold text-[10px] text-blue-800 bg-slate-100\'>${nd.img.substring(0,2).toUpperCase()}</div>'">
    </a>`;
  wrap.appendChild(div);
});
if(activeIdx >= 0){
  document.getElementById('cta').href = NODES[activeIdx].href;
  document.getElementById('cta').textContent = activeIdx===0 ? 'Mulai Misi ➔' : 'Lanjutkan Misi ➔';
} else {
  document.getElementById('cta').href = 'mission-c3-pos8-log.html';
  document.getElementById('cta').textContent = 'Lihat Badge-mu 🏅';
}
</script>
</body>
</html>
