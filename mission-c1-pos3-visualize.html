<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pos 3: Visualize | Mission C1</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* CSS Reset & Variables sama seperti sebelumnya */
:root{ --sky:#0EA5E9; --sky-d:#0369A1; --sky-dd:#0C4A6E; --sky-l:#E0F2FE; --bg:#F0F9FF; --card:#fff; --ink:#0F2A3D; --muted:#4B6A80; --ok:#10B981; --hint:#F59E0B; --line:#BAE6FD; --f-head:'Baloo 2',sans-serif; --f-body:'Nunito',sans-serif; }
*{box-sizing:border-box;margin:0} body{font-family:var(--f-body);color:var(--ink);background:var(--bg);padding-bottom:60px;}
a{text-decoration:none;color:inherit} .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-weight:800;margin:0 .15em;font-size:1.1em} .frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .2em .05em} .frac>span:last-child{padding-top:.05em}
.math{font-family:var(--f-head);font-weight:800;}
header{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5} .bar{display:flex;justify-content:space-between;padding:12px 20px;max-width:800px;margin:0 auto} .back-btn{font-weight:700;color:var(--sky-d)} .pos-badge{background:var(--sky-l);color:var(--sky-d);font-weight:800;padding:4px 12px;border-radius:99px;font-size:.9rem}
.wrap{max-width:800px;margin:0 auto;padding:30px 20px} .card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:26px;margin-bottom:24px;box-shadow:0 4px 12px rgba(14,165,233,0.05);text-align:center}
.btn{display:inline-block;background:var(--sky-d);color:#fff;font-family:var(--f-head);font-weight:800;padding:12px 28px;border-radius:99px;border:none;cursor:pointer;box-shadow:0 4px 0 var(--sky-dd);} .btn:active{transform:translateY(4px);box-shadow:none}

/* Bar Model Game */
.barmodel{display:grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 300px; height: 150px; margin: 30px auto; border: 4px solid var(--sky-dd); background: #fff;}
.barmodel > div { border-right: 4px solid var(--sky-dd); display: flex; flex-direction: column; }
.barmodel > div:last-child { border-right: none; }
.col-1 { background: var(--sky-l); } /* Arsir 1/2 */
.row-slice { flex: 1; border-bottom: 2px dashed transparent; transition: all 0.5s; display:flex; justify-content:center; align-items:center;}
.row-slice:last-child { border-bottom: none; }
.sliced .row-slice { border-bottom: 4px solid var(--sky-dd); }
.sliced .col-1 .row-slice:first-child { background: var(--hint); color: #fff; font-weight: bold; }

.msg{display:none;background:#ECFDF5;border:2px solid var(--ok);color:#065F46;padding:16px;border-radius:12px;margin-bottom:20px;}
</style>
</head>
<body>
<header><div class="bar"><a href="mission-c1.html" class="back-btn">Kembali</a><div class="pos-badge">Pos 3 / 8</div></div></header>
<main class="wrap">
  <section class="card">
    <h2 style="font-family:var(--f-head);color:var(--sky-dd);font-size:1.8rem">Bar Model Ajaib</h2>
    <p>Mari ubah gambar pizza tadi menjadi <b>Bar Model</b>. Area biru muda di bawah mewakili <span class="frac"><span>1</span><span>2</span></span> bagian.</p>
    
    <div class="barmodel" id="bar">
      <div class="col-1">
        <div class="row-slice"></div><div class="row-slice"></div><div class="row-slice"></div>
      </div>
      <div class="col-2">
        <div class="row-slice"></div><div class="row-slice"></div><div class="row-slice"></div>
      </div>
    </div>
    
    <button id="sliceBtn" class="btn">Bagi Menjadi 3 Secara Horizontal</button>

    <div id="msg" class="msg">
      <b>Lihat!</b> <br>
      Total keseluruhan sekarang ada <b>6 kotak kecil</b>. <br>
      Bagian yang diwarnai oranye (1 bagian untuk 1 orang) adalah <b>1 dari 6 kotak</b>, yaitu <span class="frac"><span>1</span><span>6</span></span>.
    </div>

    <a href="mission-c1-pos4-discover.html" id="nextBtn" class="btn" style="display:none; background:var(--ok); box-shadow:0 4px 0 #047857;" onclick="markDone()">Lanjut ke Pos 4 ➔</a>
  </section>
</main>
<script>
  document.getElementById('sliceBtn').addEventListener('click', function() {
    document.getElementById('bar').classList.add('sliced');
    this.style.display = 'none';
    document.getElementById('msg').style.display = 'block';
    document.getElementById('nextBtn').style.display = 'inline-block';
    document.querySelector('.sliced .col-1 .row-slice:first-child').innerHTML = '1/6';
  });
  function markDone(){ try{ localStorage.setItem("vml_c1_done_3", "1"); }catch(e){} }
</script>
</body>
</html>
