<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pos 2: Concrete | Mission C2</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{ --blue:#2563EB; --blue-d:#1D4ED8; --blue-dd:#1E3A8A; --bg:#F8FAFC; --ink:#0F172A; --line:#CBD5E1; --f-head:'Baloo 2',sans-serif; --f-body:'Nunito',sans-serif; }
*{box-sizing:border-box;margin:0} body{font-family:var(--f-body);color:var(--ink);background:var(--bg);padding-bottom:60px;} a{text-decoration:none;color:inherit}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-weight:800;margin:0 .15em;font-size:1.1em} .frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .2em .05em} .frac>span:last-child{padding-top:.05em} .math{font-family:var(--f-head);font-weight:800;font-size:1.2em;}
header{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5} .bar{display:flex;justify-content:space-between;padding:12px 20px;max-width:800px;margin:0 auto} .back-btn{font-weight:700;color:var(--blue-d)}
.wrap{max-width:800px;margin:0 auto;padding:30px 20px} .card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:26px;margin-bottom:24px; text-align:center;} h2{font-family:var(--f-head);font-size:1.8rem;color:var(--blue-dd);margin-bottom:12px;}

/* Game Ribbon CSS */
.ribbon-container{display:flex; flex-direction:column; gap:10px; margin:30px 0; background:#F1F5F9; padding:20px; border-radius:12px; border:2px dashed var(--blue);}
.ribbon-row{display:flex; width:100%; height:50px; background:#fff; border:3px solid #B45309; border-radius:8px;}
.ribbon-part{flex:1; border-right:2px dashed #CBD5E1; display:flex; justify-content:center; align-items:center; font-weight:800; font-size:1.1rem; color:transparent; transition:all 0.5s ease;}
.ribbon-part:last-child{border-right:none;}

/* Pengelompokan Warna - Memotong batas meter! */
.cut .g1 { background: #FCA5A5; color: #7F1D1D; border-right:3px solid #7F1D1D; } /* Kelompok 1 */
.cut .g2 { background: #6EE7B7; color: #064E3B; border-right:3px solid #064E3B; } /* Kelompok 2 */
.cut .g3 { background: #93C5FD; color: #1E3A8A; border-right:3px solid #1E3A8A; } /* Kelompok 3 */
.cut .g4 { background: #FDE047; color: #78350F; border-right:none; } /* Kelompok 4 */
.cut .ribbon-part{font-size:1.2rem;}

.btn{display:inline-block;background:var(--blue-d);color:#fff;font-family:var(--f-head);font-weight:800;font-size:1.1rem;padding:12px 28px;border-radius:99px;border:none;cursor:pointer;box-shadow:0 4px 0 var(--blue-dd);} .btn:active{transform:translateY(4px);box-shadow:none}
.btn-next{display:none;background:#10B981;box-shadow:0 4px 0 #047857;} .btn-next.show{display:inline-block;}
.message{display:none;margin-top:20px;padding:16px;background:#DBEAFE;border:2px solid var(--blue);border-radius:12px;font-weight:700; font-size:1.1rem;}
</style>
</head>
<body>
<header><div class="bar"><a href="mission-c2.html" class="back-btn">Kembali</a><div style="font-weight:bold;color:var(--blue-d);background:#DBEAFE;padding:4px 12px;border-radius:99px">Pos 2 / 8</div></div></header>
<main class="wrap">
  <section class="card">
    <h2>Visualisasi Kelompok Pita ✂️</h2>
    <p>Ini 3 meter pita utuh. Tiap meter kita beri garis potong ukuran <b><span class="frac"><span>1</span><span>4</span></span></b>. Klik tombol untuk <b>mengelompokkan setiap 3 potong kecil</b> (karena butuh <span class="frac"><span>3</span><span>4</span></span> meter).</p>
    
    <div class="ribbon-container" id="stage">
      <div style="text-align:left; font-weight:bold; color:var(--muted)">Meter 1</div>
      <div class="ribbon-row">
        <div class="ribbon-part g1">1</div><div class="ribbon-part g1">2</div><div class="ribbon-part g1">3</div><div class="ribbon-part g2">1</div>
      </div>
      <div style="text-align:left; font-weight:bold; color:var(--muted); margin-top:10px;">Meter 2</div>
      <div class="ribbon-row">
        <div class="ribbon-part g2">2</div><div class="ribbon-part g2">3</div><div class="ribbon-part g3">1</div><div class="ribbon-part g3">2</div>
      </div>
      <div style="text-align:left; font-weight:bold; color:var(--muted); margin-top:10px;">Meter 3</div>
      <div class="ribbon-row">
        <div class="ribbon-part g3">3</div><div class="ribbon-part g4">1</div><div class="ribbon-part g4">2</div><div class="ribbon-part g4">3</div>
      </div>
    </div>
    
    <button id="cutBtn" class="btn">✂️ Kelompokkan Tiap 3/4 Meter!</button>

    <div id="msg" class="message"></div>
    
    <div style="margin-top:20px;">
      <a href="mission-c2-pos3-visualize.html" id="nextBtn" class="btn btn-next" onclick="markDone()">Wow, Keren! Lanjut ke Lab Pos 3 ➔</a>
    </div>
  </section>
</main>
<script>
  document.getElementById('cutBtn').addEventListener('click', function() {
    document.getElementById('stage').classList.add('cut');
    this.style.display = 'none';
    const msg = document.getElementById('msg');
    msg.innerHTML = `
      <b>Lihat Warnanya!</b><br>
      Total ada 12 potong kecil (seperempat-an). Setiap 3 potong kecil digabung jadi 1 warna pita hias.<br>
      Ternyata, ada tepat <b>4 Kelompok Warna</b>! Pita merah, hijau, biru, dan kuning.<br><br>
      Secara matematika ditulis:<br>
      <span class="math">3 ÷ <span class="frac"><span>3</span><span>4</span></span> = 4</span>
    `;
    msg.style.display = 'block';
    document.getElementById('nextBtn').classList.add('show');
  });
  function markDone(){ try{ localStorage.setItem("vml_c2_done_2", "1"); }catch(e){} }
</script>
</body>
</html>
