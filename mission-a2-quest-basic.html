<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misi A2 · Latihan Dasar — VisualMath.Lim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* PALET WARNA DISESUAIKAN DENGAN TEMA "MARKAS" (TAILWIND SLATE) & AVATAR LUNA/KIAN */
:root {
  --paper: #0F172A; /* Slate 900 */
  --grid: #1E293B;  /* Slate 800 */
  --card: #1E293B;  
  --ink: #F8FAFC;   /* Slate 50 */
  --muted: #94A3B8; /* Slate 400 */
  --a: #A855F7;     /* Purple 500 (Luna) */
  --a-soft: #3B0764; 
  --b: #F59E0B;     /* Amber 500 (Kian) */
  --b-soft: #451A03; 
  --ok: #22C55E;    /* Emerald 500 */
  --ok-soft: #064E3B; 
  --bad: #EF4444;   /* Rose 500 */
  --bad-soft: #4C0519; 
  --brand: #38BDF8; /* Sky 400 */
  --line: #334155;  /* Slate 700 */
}

/* Fallback Light Mode jika toggle ditekan */
:root[data-theme="light"] {
  --paper: #F8FAFC; --grid: #E2E8F0; --card: #FFFFFF; --ink: #0F172A; --muted: #64748B;
  --a: #A855F7; --a-soft: #F3E8FF; --b: #F59E0B; --b-soft: #FEF3C7;
  --ok: #10B981; --ok-soft: #D1FAE5; --bad: #EF4444; --bad-soft: #FEE2E2; --brand: #0284C7; --line: #CBD5E1;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; font-family: Nunito, system-ui, sans-serif; color: var(--ink); line-height: 1.55; font-size: 17px;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  transition: background-color 0.3s, color 0.3s;
}

h1, h2, h3 { font-family: "Baloo 2", Nunito, sans-serif; line-height: 1.15; margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 64px; }
header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0 16px; border-bottom: 2px solid var(--line); margin-bottom: 20px;}
.brand { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.25rem; }
.brand b { color: var(--brand); }
.brand small { display: block; font-family: Nunito, sans-serif; font-weight: 600; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;}
.crumb { font-size: .9rem; color: var(--muted); margin-bottom: 15px;}
.crumb a { color: var(--brand); text-decoration: none; font-weight: bold;}

/* Hero Section ala Markas */
.hero { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 20px; display: flex; gap: 20px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);}
.hero-avatar { width: 80px; height: 80px; background: var(--grid); border-radius: 50%; border: 3px solid var(--brand); padding: 5px; flex-shrink: 0;}
.hero-text { flex: 1; }
.hero h1 { font-size: clamp(1.4rem, 4vw, 1.8rem); margin-bottom: 6px; color: var(--brand); }
.hero p { margin: 0 0 14px; color: var(--muted); font-size: 0.95rem;}

/* Demo Bar (Luna & Kian colors) */
.bar-demo { display: grid; grid-template-columns: repeat(4, 1fr); height: 24px; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; width: 150px;}
.bar-demo span:nth-child(-n+2) { background: var(--a); } /* 2/4 Ungu */
.bar-demo span:nth-child(3) { background: var(--b); }    /* 1/4 Oranye */
.bar-demo span { border-right: 2px solid var(--ink); } 
.bar-demo span:last-child { border: 0; }

.prog { margin-top: 16px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: .95rem; }
.track { flex: 1; height: 14px; border-radius: 99px; background: var(--grid); border: 2px solid var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--a)); transition: width .5s cubic-bezier(0.4, 0, 0.2, 1); }

/* Levels */
.level { margin-top: 40px; position: relative; }
.level>h2 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--ink);}
.tag { font-family: Nunito, sans-serif; font-size: .75rem; font-weight: 800; padding: 4px 12px; border-radius: 99px; background: var(--a-soft); color: var(--a); border: 1.5px solid var(--a); text-transform: uppercase;}
.level .tip { color: var(--muted); margin: 6px 0 16px; font-size: 0.9rem; border-left: 3px solid var(--brand); padding-left: 10px;}

.level.locked .qs { opacity: .3; filter: grayscale(1); pointer-events: none; user-select: none; }
.lock-note { display: none; background: var(--b-soft); border: 2px dashed var(--b); color: var(--b); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; font-weight: 600; text-align: center;}
.level.locked .lock-note { display: block; }

/* Question Cards */
.q { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; transition: all .2s; }
.q:hover { border-color: var(--muted); }
.q.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 0 15px rgba(34, 197, 94, 0.1); }
.q.wrong { border-color: var(--bad); animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

.qn { font-weight: 800; color: var(--brand); font-size: .85rem; text-transform: uppercase; letter-spacing: 1px;}
.expr { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 12px 0 16px; font-family: "Baloo 2", sans-serif; font-size: 2rem; font-weight: 800; }

.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; }
.frac i { font-style: normal; padding: 0 6px; }
.frac i:first-child { border-bottom: 3px solid currentColor; }

/* Input Styling */
.frac input { width: 68px; font: 800 1.5rem "Baloo 2", sans-serif; text-align: center; padding: 4px; border: 2px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); transition: border-color 0.2s;}
.frac input:first-child { margin-bottom: 6px; }
.frac input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
.frac input:disabled { opacity: .6; background: transparent; border-color: transparent; }

.acts { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: 800 .95rem Nunito, sans-serif; cursor: pointer; border-radius: 10px; padding: 10px 18px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); transition: transform 0.1s, opacity 0.2s; }
button:active { transform: scale(0.96); }
button.go { background: var(--brand); color: #fff; border-color: var(--brand); }
button.go:hover { filter: brightness(1.1); }
button.bm { background: transparent; border-color: var(--line); color: var(--muted); }
button.bm:hover { color: var(--ink); border-color: var(--muted); }
button:disabled { opacity: .4; pointer-events: none; }

/* Feedback */
.fb { margin-top: 16px; padding: 12px 16px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; display: none; line-height: 1.5;}
.fb.show { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from {opacity:0; transform:translateY(-5px)} to {opacity:1; transform:translateY(0)} }
.fb.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
.fb.no { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }

/* Pesan Bantuan Markas */
.fb.sol { background: var(--grid); border: 1px dashed var(--brand); color: var(--ink); font-weight: 400; font-size: 0.9rem; position: relative;}
.fb.sol::before { content: "📡 Transmisi Prof. Sigma:"; display: block; font-weight: 800; color: var(--brand); margin-bottom: 4px; font-size: 0.85rem; text-transform: uppercase;}

/* Bar Model Render */
.model { display: none; margin-top: 16px; padding: 16px; border: 2px dashed var(--line); border-radius: 12px; background: var(--grid); }
.model.show { display: block; animation: fadeIn 0.3s; }
.row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.row label { width: 68px; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.1rem; text-align: right; flex-shrink: 0; color: var(--muted);}
.cells { flex: 1; display: grid; height: 32px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--card); }
.cells span { border-right: 1.5px solid var(--line); } 
.cells span:last-child { border-right: 0; }
.cells .fa { background: var(--a); } /* Ungu */
.cells .fb2 { background: var(--b); } /* Oranye */
.note { font-size: .85rem; color: var(--muted); margin-top: 12px; text-align: center; font-weight: 600;}

/* Final Screen */
.done { display: none; margin-top: 40px; background: var(--card); border: 2px solid var(--brand); border-radius: 18px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 30px rgba(56,189,248,0.2); }
.done.show { display: block; animation: fadeIn 0.5s; }
.done h2 { font-size: 1.8rem; color: var(--brand);}
.stars { font-size: 2.5rem; letter-spacing: 5px; margin: 10px 0; }
.next { display: inline-block; margin-top: 20px; background: var(--brand); color: #fff; text-decoration: none; font-weight: 800; padding: 14px 28px; border-radius: 12px; transition: transform 0.2s;}
.next:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(56,189,248,0.4);}
.theme { font-size: 1.1rem; padding: 6px 10px; background: transparent; border-color: var(--line); border-radius: 50%;}

@media(max-width:480px){
  .hero { flex-direction: column; text-align: center; gap: 10px;}
  .row label { width: 50px; font-size: .9rem; }
  .expr { font-size: 1.6rem; }
  .frac input { width: 54px; font-size: 1.2rem;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Visual<b>Math</b>.Lim<small>Math Mastery • Kelas 6</small></div>
    <!-- Tombol Toggle Tema tetap disediakan -->
    <button class="theme" id="themeBtn" aria-label="Ganti tema">🌓</button>
  </header>
  
  <div class="crumb"><a href="mission-a-hub.html">Misi A2</a> › <span>Zona Latihan Dasar</span></div>

  <section class="hero">
    <!-- Gambar Avatar Prof Sigma (Opsional, akan pakai emoji jika gagal muat) -->
    <img src="assets/sigma.png" alt="Prof. Sigma" class="hero-avatar" onerror="this.outerHTML='<div class=\'hero-avatar\' style=\'display:flex;align-items:center;justify-content:center;font-size:40px\'>🦉</div>'">
    <div class="hero-text">
        <h1>Zona Latihan Dasar</h1>
        <p>"Agent, uji rumus Aturan Emas di sini! Kamu langsung tahu benar/salah. Jika bingung, panggil <b>Bar Model</b> sebagai bantuan visualmu."</p>
        <div class="prog"><span id="progTxt">0 / 9 Sistem Diretas</span><div class="track"><div class="fill" id="fill"></div></div></div>
    </div>
  </section>

  <div id="app"></div>

  <section class="done" id="done">
    <h2>Misi A2 Dasar Selesai! 🎉</h2>
    <div class="stars" id="stars"></div>
    <p id="doneTxt" style="color:var(--muted)"></p>
    <a class="next" href="mission-a2-quest-word-problems.html">Lanjut ke Misi Analisis (HOTS) ➔</a>
  </section>
</div>

<script>
// Data Level disesuaikan agar sesuai dengan kaidah Matematika
const LEVELS=[
 {id:1,title:"Level 1: Penyebut Sama",tag:"Pemanasan",tip:"Penyebutnya sudah sama. Cukup eksekusi pembilangnya!",
  qs:[[2,7,3,7],[3,8,2,8],[4,9,2,9]]},
 {id:2,title:"Level 2: Penyebut Kelipatan",tag:"Taktikal",tip:"Satu penyebut bisa diubah menjadi penyebut lainnya (Kelipatan).",
  qs:[[1,2,1,4],[2,3,1,6],[3,5,1,10]]},
 {id:3,title:"Level 3: Misi Persilangan",tag:"Tantangan",tip:"Penyebutnya beda dan bukan kelipatan. Temukan KPK atau Kali Silang!",
  qs:[[1,2,1,3],[1,4,1,3],[2,5,1,3]]}
];

const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a*b/gcd(a,b);
const F=(n,d)=>`<span class="frac"><i>${n}</i><i>${d}</i></span>`;
let correct=0, firstTry=0, total=9;
const state={};

function solution(a,b,c,d){
  const L=lcm(b,d), na=a*L/b, nc=c*L/d, s=na+nc, g=gcd(s,L);
  let t="";
  if(b===d) t=`Penyebut sudah sama (<strong>${b}</strong>). Cukup jumlahkan atasnya: ${a} + ${c} = ${s}.<br>Hasil: ${F(s,L)}`;
  else t=`KPK dari ${b} dan ${d} adalah <strong>${L}</strong>.<br>Ubah wujudnya: ${F(a,b)} jadi ${F(na,L)} dan ${F(c,d)} jadi ${F(nc,L)}.<br>Jumlahkan atasnya: ${na} + ${nc} = ${s}.<br>Hasil sementara: ${F(s,L)}`;
  if(g>1) t+=`<br>🌟 Bentuk Paling Sederhana: <strong>${F(s/g,L/g)}</strong> (dibagi ${g})`;
  return t;
}

function hint(a,b,c,d,lv){
  if(lv===1) return "Awas jebakan Pixel! Penyebut (bawah) JANGAN ditambahkan. Cukup tambahkan yang atas (pembilang).";
  const L=lcm(b,d);
  return `Aturan Emas: Samakan dulu penyebutnya menjadi KPK-nya yaitu <strong>${L}</strong>, baru jumlahkan atasnya.`;
}

function bar(a,b,c,d){
  const L=lcm(b,d), na=a*L/b, nc=c*L/d;
  const cells=(f,cls,off=0)=>`<div class="cells" style="grid-template-columns:repeat(${L},1fr)">`+
    Array.from({length:L},(_,i)=>`<span class="${i>=off&&i<off+f?cls:''}"></span>`).join("")+`</div>`;
  return `<div class="row"><label>${a}/${b}</label>${cells(na,'fa')}</div>
  <div class="row"><label>${c}/${d}</label>${cells(nc,'fb2')}</div>
  <div class="row"><label>Hasil</label><div class="cells" style="grid-template-columns:repeat(${L},1fr)">${
    Array.from({length:L},(_,i)=>`<span class="${i<na?'fa':i<na+nc?'fb2':''}"></span>`).join("")}</div></div>
  <div class="note">${b!==d?`Bar dipotong menjadi <b>${L}</b> bagian sama besar (KPK ${b} &${d}).<br>`:''}Luna (Ungu) ${na} potong + Kian (Oranye) ${nc} potong = <b>${na+nc} potong</b> dari total ${L}.</div>`;
}

function build(){
  const app=document.getElementById("app");
  let html="", n=0;
  LEVELS.forEach((lv,li)=>{
    html+=`<section class="level ${li?'locked':''}" id="lv${lv.id}" data-lv="${lv.id}">
      <h2>${lv.title} <span class="tag">${lv.tag}</span></h2><p class="tip">${lv.tip}</p>
      <div class="lock-note">🔒 Area Terlarang! Selesaikan Level ${lv.id-1} untuk membuka kunci akses.</div><div class="qs">`;
    lv.qs.forEach(q=>{
      n++; const [a,b,c,d]=q;
      state[n]={q,lv:lv.id,tries:0,done:false};
      // Tambahkan inputmode dan pattern agar muncul numpad di HP
      html+=`<div class="q" id="q${n}"><div class="qn">Misi 0${n}</div>
        <div class="expr">${F(a,b)} <span style="color:var(--brand)">+</span> ${F(c,d)} <span style="color:var(--brand)">=</span>
          <span class="frac">
             <input id="n${n}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Pembilang">
             <input id="d${n}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Penyebut">
          </span>
        </div>
        <div class="acts">
            <button class="go" data-check="${n}">Kirim Jawaban</button>
            <button class="bm" data-bm="${n}" aria-expanded="false">👁️ Visual Bar Model</button>
        </div>
        <div class="model" id="m${n}"></div><div class="fb" id="f${n}" role="status" aria-live="polite"></div></div>`;
    });
    html+=`</div></section>`;
  });
  app.innerHTML=html;
}

function check(n){
  const s=state[n]; if(s.done) return;
  const [a,b,c,d]=s.q, L=lcm(b,d), tn=a*L/b+c*L/d;
  const N=parseInt(document.getElementById("n"+n).value), D=parseInt(document.getElementById("d"+n).value);
  const box=document.getElementById("q"+n), fb=document.getElementById("f"+n);
  
  if(!N||!D){fb.className="fb show no"; fb.innerHTML="⚠️ Agent, lengkapi angka atas dan bawah sebelum mengirim!"; return;}
  
  s.tries++;
  box.classList.remove("wrong");
  
  if(N*L===tn*D){
    s.done=true; correct++; if(s.tries===1) firstTry++;
    box.classList.add("right");
    const g=gcd(tn,L), simple=(N===tn/g&&D===L/g);
    fb.className="fb show ok";
    fb.innerHTML=(simple?"✅ Tepat Sasaran! ":"✅ Nilai benar! (Bentuk paling sederhana: "+F(tn/g,L/g)+"). ")+
      (s.tries===1?"Insting matematikamu bekerja sempurna.":"Bagus, kamu berhasil menganalisis letak kesalahanmu.");
    ["n","d"].forEach(p=>document.getElementById(p+n).disabled=true);
    document.querySelector(`[data-check="${n}"]`).disabled=true;
    updateProgress(); unlock();
  } else {
    void box.offsetWidth; box.classList.add("wrong");
    fb.className="fb show no";
    fb.innerHTML="❌ " + hint(a,b,c,d,s.lv) + (s.tries>=2?`<div class="fb sol show"><b>Bongkar Kasus:</b><br>${solution(a,b,c,d)}</div>`:"");
  }
}

function updateProgress(){
  document.getElementById("progTxt").textContent=`${correct} / ${total} Kode Terpecahkan`;
  document.getElementById("fill").style.width=(correct/total*100)+"%";
}

function unlock(){
  LEVELS.forEach((lv,i)=>{
    const ids=Object.keys(state).filter(k=>state[k].lv===lv.id);
    if(ids.every(k=>state[k].done)){
      const nx=document.getElementById("lv"+(lv.id+1));
      if(nx&&nx.classList.contains("locked")){
          nx.classList.remove("locked");
          setTimeout(()=>nx.scrollIntoView({behavior:"smooth",block:"start"}),500);
      }
    }
  });
  if(correct===total) finish();
}

function finish(){
  const pct=firstTry/total, st=pct>=.8?3:pct>=.5?2:1;
  document.getElementById("stars").textContent="⭐".repeat(st)+"☆".repeat(3-st);
  document.getElementById("doneTxt").innerHTML=`Akurasi Percobaan Pertama: <b>${firstTry} dari ${total}</b>.<br>`+
    (st===3?"Luar biasa! Kamu sudah menguasai fondasi operasi pecahan.":"Tidak apa-apa, agen terbaik pun butuh latihan. Gunakan Bar Model di percobaan berikutnya!");
  const d=document.getElementById("done"); d.classList.add("show");
  setTimeout(()=>d.scrollIntoView({behavior:"smooth",block:"center"}),400);
}

build();
document.getElementById("app").addEventListener("click",e=>{
  const c=e.target.closest("[data-check]"), m=e.target.closest("[data-bm]");
  if(c) check(c.dataset.check);
  if(m){
    const n=m.dataset.bm, box=document.getElementById("m"+n), open=!box.classList.contains("show");
    if(open&&!box.innerHTML){const [a,b,cc,d]=state[n].q;box.innerHTML=bar(a,b,cc,d);}
    box.classList.toggle("show",open); m.setAttribute("aria-expanded",open);
    m.innerHTML=open?"🙈 Tutup Bar Model":"👁️ Visual Bar Model";
  }
});

// Submit on Enter
document.getElementById("app").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.tagName==="INPUT"){const n=e.target.id.slice(1);check(n);}
});

// Theme Toggle
document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement;
  const cur=r.dataset.theme||"dark";
  r.dataset.theme=cur==="dark"?"light":"dark";
};
</script>
</body>
</html>
