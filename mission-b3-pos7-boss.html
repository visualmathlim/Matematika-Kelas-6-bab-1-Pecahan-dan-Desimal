<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pos 7: Boss Battle HOTS - Mission B3 | VisualMath.Lim</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{ --navy:#0d1b4c; --navy-card:#16214f; --teal:#14a89a; --gold:#f4b400; --green-dk:#0d766b; --ink:#f1f5f9; --line:#2a3868; }
  body{ background-color:var(--navy); color:var(--ink); font-family:'Segoe UI',Tahoma,Verdana,sans-serif; }
  .card-dark{ background-color:var(--navy-card); border:1px solid var(--line); }
  .boss{ background:linear-gradient(135deg,#241548,#2c1a5c); border:1px solid #4c2f8c; }
  .input-dark{ background:#0a1338; border:1px solid #475569; color:var(--ink); border-radius:.5rem; padding:.5rem .7rem; }
  .btn{ padding:.6rem 1.3rem; border-radius:9999px; font-weight:bold; color:#fff; cursor:pointer; transition: transform 0.2s; }
  .btn:hover{ transform: translateY(-1px); }
  .cell{ border:1px solid rgba(255,255,255,.15); }

  /* PENGATURAN PECAHAN VERTIKAL ATAS-BAWAH */
  .math-frac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .25rem; font-weight:bold; line-height:1.1; }
  .math-num{ border-bottom:2px solid currentColor; padding:0 .3rem; width:100%; text-align:center; }
  .math-den{ padding:0 .3rem; width:100%; text-align:center; }
</style>
</head>
<body class="antialiased min-h-screen flex flex-col">

<header class="card-dark border-b sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <img src="assets/logo.png" alt="VisualMath.Lim" class="h-10 w-auto" onerror="this.outerHTML='<div class=\'h-10 w-10 bg-slate-800 rounded-full flex items-center justify-center font-bold text-amber-400\'>VM</div>'">
      <div><h1 class="text-lg font-bold" style="color:var(--gold)">VisualMath.Lim</h1><p class="text-[11px] text-slate-300">Mission B3 • Kelas 6</p></div>
    </div>
    <span class="px-3 py-1 rounded-full text-xs font-semibold" style="background:rgba(20,168,154,.15); border:1px solid var(--teal); color:var(--teal)">👾 Pos 7/8: Boss Battle</span>
  </div>
  <div class="h-1.5 w-full" style="background:#0a1338"><div class="h-full" style="width:87.5%; background:linear-gradient(to right,var(--teal),var(--gold))"></div></div>
</header>

<main class="flex-grow max-w-3xl mx-auto w-full px-4 py-10 space-y-6">

  <section class="text-center space-y-2">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-sm border" style="border-color:var(--line); background:var(--navy-card)">👾 Boss Battle</div>
    <h2 class="text-3xl font-extrabold">Soal HOTS Berlapis</h2>
    <p class="text-sm text-slate-300">KKM 70 • Dikerjakan bertahap • Jawaban tersimpan otomatis</p>
  </section>

  <div id="hots-area"></div>
  <div id="result-area" class="hidden card-dark rounded-2xl p-6 space-y-4 text-center border-2 border-slate-700 shadow-xl"></div>

  <div class="flex justify-between items-center pt-2">
    <a href="mission-b3-pos6-quiz.html" class="text-slate-400 hover:text-white text-sm">⬅ Quest</a>
    <a id="nav-next" href="mission-b3-pos8-log.html" class="hidden inline-block font-bold py-3 px-8 rounded-full text-white shadow-lg transition-transform hover:-translate-y-0.5" style="background:linear-gradient(to right,var(--teal),var(--green-dk))">Lanjut ke Mission Log ➔</a>
  </div>

</main>

<script>
// 5 SOAL HOTS BERLAPIS DENGAN FORMAT PECAHAN HTML VERTIKAL
const HOTS_BANK = [
  {
    story: "Kebun Pak Budi berbentuk persegi panjang. <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></span> dari kebun ditanami padi. Dari lahan padi itu, <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span> bagiannya sudah dipanen. Sisa lahan padi yang belum dipanen, ditanami ulang dengan jagung seluas itu juga. Berapa bagian dari SELURUH kebun yang sekarang ditanami jagung?",
    stepPrompt1: "Berapa bagian dari lahan PADI yang belum dipanen? (1 − <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span>)",
    step1Answer: "1/4", step1Points: 30,
    stepPrompt2: "Berapa bagian dari SELURUH kebun yang ditanami jagung? (<span class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></span> × jawaban langkah 1)",
    step2Answer: "1/6", step2Points: 70,
    fullSteps: [
      "Bagian padi belum dipanen = 1 − <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span> = <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>4</span></span> (dari lahan padi)",
      "Bagian dari SELURUH kebun = <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></span> × <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>4</span></span> = <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>12</span></span> disederhanakan menjadi <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>6</span></span>",
      "Karena jagung ditanami seluas sisa itu juga, maka jagung = <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>6</span></span> dari seluruh kebun."
    ],
    gridB:3, gridD:4, shadeA:2, shadeC:1
  },
  {
    story: "Kolam ikan Bu Sari berbentuk persegi panjang. <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>5</span></span> dari kolam untuk ikan lele. Dari bagian lele itu, <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></span>-nya sudah dipanen. Sisa yang belum dipanen ditambah ikan nila seluas itu juga. Berapa bagian dari SELURUH kolam yang sekarang berisi ikan nila?",
    stepPrompt1: "Berapa bagian dari lahan LELE yang belum dipanen? (1 − <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></span>)",
    step1Answer: "1/3", step1Points: 30,
    stepPrompt2: "Berapa bagian dari SELURUH kolam yang berisi ikan nila? (<span class='math-frac'><span class='math-num'>3</span><span class='math-den'>5</span></span> × jawaban langkah 1)",
    step2Answer: "1/5", step2Points: 70,
    fullSteps: [
      "Bagian lele belum dipanen = 1 − <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></span> = <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>3</span></span> (dari lahan lele)",
      "Bagian dari SELURUH kolam = <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>5</span></span> × <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>3</span></span> = <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>15</span></span> disederhanakan menjadi <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>5</span></span>",
      "Karena nila ditambah seluas sisa itu juga, maka nila = <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>5</span></span> dari seluruh kolam."
    ],
    gridB:5, gridD:3, shadeA:3, shadeC:1
  },
  {
    story: "Ibu memiliki persediaan tepung di wadah sebanyak <span class='math-frac'><span class='math-num'>4</span><span class='math-den'>5</span></span> bagian. Untuk membuat kue bolu, ibu menggunakan <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span> bagian dari tepung yang ada di wadah tersebut. Berapa bagian dari kapasitas wadah penuh yang dipakai ibu untuk membuat kue bolu?",
    stepPrompt1: "Berapa bagian wadah yang terisi tepung mula-mula? (<span class='math-frac'><span class='math-num'>4</span><span class='math-den'>5</span></span> bagian)",
    step1Answer: "4/5", step1Points: 30,
    stepPrompt2: "Berapa bagian dari SELURUH kapasitas wadah yang dipakai untuk kue? (<span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span> × <span class='math-frac'><span class='math-num'>4</span><span class='math-den'>5</span></span>)",
    step2Answer: "3/5", step2Points: 70,
    fullSteps: [
      "Tepung mula-mula di wadah = <span class='math-frac'><span class='math-num'>4</span><span class='math-den'>5</span></span>",
      "Tepung terpakai = <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span> × <span class='math-frac'><span class='math-num'>4</span><span class='math-den'>5</span></span>",
      "Gunakan pencoretan silang (Cross-Cancel): angka 4 di atas dan di bawah saling dicoret menjadi 1, sehingga menghasilkan <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>5</span></span>."
    ],
    gridB:5, gridD:4, shadeA:4, shadeC:3
  },
  {
    story: "Sebuah tangki air terisi air sebanyak <span class='math-frac'><span class='math-num'>5</span><span class='math-den'>6</span></span> bagian. Karena ada kebocoran, air di dalam tangki berkurang sebanyak <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>5</span></span> bagian dari sisa air tersebut. Berapa bagian air yang keluar dari tangki dibandingkan dengan kapasitas SELURUH tangki?",
    stepPrompt1: "Berapa bagian air mula-mula di dalam tangki? (<span class='math-frac'><span class='math-num'>5</span><span class='math-den'>6</span></span> bagian)",
    step1Answer: "5/6", step1Points: 30,
    stepPrompt2: "Berapa bagian air yang bocor dari SELURUH tangki? (<span class='math-frac'><span class='math-num'>2</span><span class='math-den'>5</span></span> × <span class='math-frac'><span class='math-num'>5</span><span class='math-den'>6</span></span>)",
    step2Answer: "1/3", step2Points: 70,
    fullSteps: [
      "Air mula-mula = <span class='math-frac'><span class='math-num'>5</span><span class='math-den'>6</span></span>",
      "Air yang bocor = <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>5</span></span> × <span class='math-frac'><span class='math-num'>5</span><span class='math-den'>6</span></span>",
      "Coret angka 5 di atas dan di bawah menjadi 1. Coret 2 dan 6 menjadi 1 dan 3. Hasil akhir = <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>3</span></span> bagian dari seluruh tangki."
    ],
    gridB:6, gridD:5, shadeA:5, shadeC:2
  },
  {
    story: "Dalam sebuah kotak donat, terdapat <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span> bagian donat rasa cokelat. Kakak mengambil <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></span> bagian dari donat cokelat tersebut untuk dibagikan kepada temannya. Berapa bagian dari SELURUH isi kotak donat yang diambil oleh kakak?",
    stepPrompt1: "Berapa bagian donat cokelat di dalam kotak? (<span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span> bagian)",
    step1Answer: "3/4", step1Points: 30,
    stepPrompt2: "Berapa bagian dari SELURUH isi kotak yang diambil kakak? (<span class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></span> × <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span>)",
    step2Answer: "1/2", step2Points: 70,
    fullSteps: [
      "Donat cokelat = <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span>",
      "Donat yang diambil kakak = <span class='math-frac'><span class='math-num'>2</span><span class='math-den'>3</span></span> × <span class='math-frac'><span class='math-num'>3</span><span class='math-den'>4</span></span>",
      "Coret angka 3 di atas dan di bawah menjadi 1. Coret 2 dan 4 menjadi 1 dan 2. Hasil akhir = <span class='math-frac'><span class='math-num'>1</span><span class='math-den'>2</span></span> bagian dari seluruh isi kotak."
    ],
    gridB:4, gridD:3, shadeA:3, shadeC:2
  }
];

const LOG_KEY = 'vm_b3_pos7';
function getLog(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)) || {attempts:[], bestScore:0, passed:false}; }catch(e){ return {attempts:[], bestScore:0, passed:false}; } }
function saveLog(log){ localStorage.setItem(LOG_KEY, JSON.stringify(log)); }
function norm(s){ return s.trim().replace(/\s/g,'').replace(/^0+(\d)/,'$1'); }
function fracEqual(input, target){
  input = norm(input); 
  if(input === target) return true;
  const [tn,td] = target.split('/').map(Number);
  const m = input.match(/^(\d+)\/(\d+)$/);
  if(m){ const n=+m[1], d=+m[2]; return d!==0 && Math.abs(n/d - tn/td) < 0.001; }
  const asNum = parseFloat(input);
  return !isNaN(asNum) && Math.abs(asNum - tn/td) < 0.005;
}

const hotsArea = document.getElementById('hots-area');
const resultArea = document.getElementById('result-area');
const navNext = document.getElementById('nav-next');

function pickQuestion(){
  const log = getLog();
  const q = HOTS_BANK[log.attempts.length % HOTS_BANK.length];
  render(q);
}

function render(q){
  resultArea.classList.add('hidden');
  navNext.classList.add('hidden');
  hotsArea.innerHTML = `
    <div class="boss rounded-2xl p-6 space-y-5 border-2 border-purple-900 shadow-2xl">
      <p class="text-slate-100 text-sm leading-relaxed">${q.story}</p>
      <div class="grid mx-auto gap-1 p-2 bg-slate-900/80 rounded-xl border border-slate-700 shadow-inner" id="hots-grid" style="grid-template-columns:repeat(${q.gridB},1fr); max-width:220px; aspect-ratio:${q.gridB}/${q.gridD};"></div>
      <p class="text-xs text-slate-400 text-center font-semibold">Diagram bantu: kolom = bagian pertama, baris = bagian kedua.</p>
      
      <div class="bg-slate-900/60 rounded-xl p-4 space-y-2 text-sm border border-slate-700">
        <label class="block font-medium text-slate-200">Langkah 1: ${q.stepPrompt1}</label>
        <input id="step1" type="text" class="input-dark w-full font-bold text-teal-300" placeholder="Contoh: 1/4">
      </div>
      
      <div class="bg-slate-900/60 rounded-xl p-4 space-y-2 text-sm border border-slate-700">
        <label class="block font-medium text-slate-200">Langkah 2: ${q.stepPrompt2}</label>
        <input id="step2" type="text" class="input-dark w-full font-bold text-amber-300" placeholder="Contoh: 1/6">
      </div>
      
      <button id="submit-hots" class="btn w-full py-3 shadow-lg" style="background:var(--teal)">Kumpulkan Jawaban Boss ➔</button>
    </div>`;

  const grid = document.getElementById('hots-grid');
  for(let r=0;r<q.gridD;r++){
    for(let c=0;c<q.gridB;c++){
      const cell = document.createElement('div');
      cell.className = 'cell aspect-square rounded-sm';
      cell.style.background = (c<q.shadeA && r<q.shadeC) ? 'var(--green-dk)' : (c<q.shadeA ? 'var(--teal)' : (r<q.shadeC ? 'var(--gold)' : '#0a1338'));
      grid.appendChild(cell);
    }
  }

  document.getElementById('submit-hots').addEventListener('click', () => grade(q));
}

function grade(q){
  const v1 = document.getElementById('step1').value;
  const v2 = document.getElementById('step2').value;
  let score = 0;
  if(fracEqual(v1, q.step1Answer)) score += q.step1Points;
  if(fracEqual(v2, q.step2Answer)) score += q.step2Points;
  const passed = score >= 70;

  const log = getLog();
  log.attempts.push({score, date:new Date().toLocaleString('id-ID')});
  log.bestScore = Math.max(log.bestScore, score);
  log.passed = log.passed || passed;
  saveLog(log);

  document.getElementById('submit-hots').disabled = true;
  document.getElementById('submit-hots').style.opacity = .4;

  resultArea.classList.remove('hidden');
  if(passed){
    resultArea.innerHTML = `<p class="text-3xl font-extrabold text-teal-400 mb-2">✅ SKOR: ${score} — LULUS KKM!</p>
      <p class="text-sm text-slate-200">Luar biasa! Kamu berhasil menaklukkan Boss Battle HOTS berlapis ini. Silakan lanjut ke Mission Log untuk melihat rekam jejak misimu.</p>`;
    navNext.classList.remove('hidden');
  } else {
    let html = `<p class="text-3xl font-extrabold text-red-400 mb-1">❌ SKOR: ${score} — Belum Mencapai KKM (70)</p>
      <p class="text-sm text-slate-300 mb-3">Jangan menyerah! Pelajari pembahasan lengkap langkah demi langkah di bawah ini:</p>
      <div class="text-left bg-slate-900/80 rounded-xl p-4 text-sm border border-slate-700 shadow-inner space-y-2">
        <p class="font-bold text-amber-300 mb-1">Pembahasan Lengkap:</p>
        <ul class="list-disc list-inside space-y-1.5 text-slate-200">${q.fullSteps.map(s=>`<li>${s}</li>`).join('')}</ul>
      </div>
      <button id="retry-hots" class="btn mt-4 py-3 px-8 shadow-lg" style="background:var(--gold); color:var(--navy)">🔄 Coba Soal HOTS Lain</button>`;
    resultArea.innerHTML = html;
    document.getElementById('retry-hots').addEventListener('click', pickQuestion);
  }
}

pickQuestion();
</script>
</body>
</html>
