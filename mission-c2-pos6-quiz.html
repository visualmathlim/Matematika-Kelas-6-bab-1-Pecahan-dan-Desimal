<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pos 6: Quest Kuis | Mission C2</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{ --blue:#2563EB; --blue-d:#1D4ED8; --blue-dd:#1E3A8A; --blue-l:#DBEAFE; --bg:#F8FAFC; --ink:#0F172A; --line:#CBD5E1; --f-head:'Baloo 2',sans-serif; --f-body:'Nunito',sans-serif;}
*{box-sizing:border-box;margin:0} body{font-family:var(--f-body);color:var(--ink);background:var(--bg);padding-bottom:60px;} a{text-decoration:none}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-weight:800;margin:0 .15em; font-size:1.1em;} .frac>span:first-child{border-bottom:.09em solid currentColor;padding:0 .2em .05em} .frac>span:last-child{padding-top:.05em} .math{font-family:var(--f-head);font-weight:800; font-size:1.1em;}
header{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5} .bar{display:flex;justify-content:space-between;padding:12px 20px;max-width:800px;margin:0 auto; align-items:center;} .back-btn{font-weight:700;color:var(--blue-d)} .pos-badge{background:var(--blue-l);color:var(--blue-d);font-weight:800;padding:4px 12px;border-radius:99px;}
.wrap{max-width:650px;margin:0 auto;padding:30px 20px} .card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 4px 12px rgba(37,99,235,0.05);}
h2{font-family:var(--f-head);color:var(--blue-dd);text-align:center;margin-bottom:5px;}

.opt{display:flex;align-items:center;gap:15px;background:var(--bg);border:2px solid var(--line);padding:14px 18px;border-radius:12px;margin-top:12px;cursor:pointer;transition:all .2s; font-size:1.1rem;}
.opt:hover{border-color:var(--blue);} .opt.sel{background:#EFF6FF;border-color:var(--blue-d);box-shadow:0 0 0 2px var(--blue-l);}
.btn{display:block;background:var(--blue-d);color:#fff;font-family:var(--f-head);font-weight:800;padding:16px;border-radius:99px;text-align:center;width:100%;border:none;cursor:pointer;font-size:1.2rem;margin-top:25px; transition:transform 0.1s;}
.btn:active{transform:translateY(4px);}
</style>
</head>
<body>
<header><div class="bar"><a href="mission-c2.html" class="back-btn">Kembali</a><div class="pos-badge">Pos 6 / 8</div></div></header>
<main class="wrap">
  <div id="intro">
    <h2>Quest Kuis C2</h2>
    <p style="text-align:center; color:#475569; margin-bottom:20px;">Terapkan cara cepat K-C-F. Target KKM: 70 (Min 4 Benar).</p>
  </div>
  
  <div id="quiz-area"></div>
  
  <button id="submitBtn" class="btn">Kirim Jawaban</button>
  
  <div id="result-area" style="display:none; text-align:center; background:#fff; padding:40px 20px; border-radius:18px; border:2px solid var(--line); box-shadow:0 10px 25px rgba(0,0,0,0.05);">
    <h2 id="scoreTxt" style="font-size:3.5rem; margin-bottom:10px; line-height:1;"></h2>
    <p id="msgTxt" style="margin-bottom:25px; font-weight:bold; font-size:1.2rem;"></p>
    <a href="mission-c2-pos7-boss.html" id="nextLvl" class="btn" style="display:none; background:#10B981; box-shadow:0 6px 0 #047857;">Lulus! Lanjut ke Boss Battle ➔</a>
    <button onclick="location.reload()" class="btn" id="retryBtn" style="background:#F59E0B; margin-top:15px; box-shadow:0 6px 0 #B45309;">Coba Lagi</button>
  </div>
</main>

<script>
// Data Soal
const qs = [
  { q: 'Hasil dari <span class="math">2 ÷ <span class="frac"><span>1</span><span>3</span></span></span> adalah...', a: ['<span class="frac"><span>2</span><span>3</span></span>', '6', '<span class="frac"><span>1</span><span>6</span></span>'], c: 1 },
  { q: 'Berapakah hasil dari <span class="math">3 ÷ <span class="frac"><span>2</span><span>5</span></span></span> ?', a: ['<span class="frac"><span>15</span><span>2</span></span> atau <span class="math">7<span class="frac"><span>1</span><span>2</span></span></span>', '<span class="frac"><span>6</span><span>5</span></span> atau <span class="math">1<span class="frac"><span>1</span><span>5</span></span></span>', '<span class="frac"><span>2</span><span>15</span></span>'], c: 0 },
  { q: 'Ibu memiliki 4 meter pita. Pita tersebut akan dipotong-potong menjadi hiasan kado dengan panjang masing-masing <span class="frac"><span>1</span><span>2</span></span> meter. Berapa banyak hiasan kado yang didapat?', a: ['2 hiasan kado', '6 hiasan kado', '8 hiasan kado'], c: 2 },
  { q: 'Hitunglah: <span class="math">4 ÷ <span class="frac"><span>4</span><span>5</span></span> = ...</span> (Ingat, hasil akhirnya bisa disederhanakan!)', a: ['5', '<span class="frac"><span>16</span><span>5</span></span>', '<span class="frac"><span>5</span><span>16</span></span>'], c: 0 },
  { q: 'Sebuah galon berisi 6 liter air bersih. Air tersebut dituang ke botol-botol kecil. Tiap botol berisi <span class="frac"><span>2</span><span>3</span></span> liter air. Berapa banyak botol yang terisi penuh?', a: ['4 botol', '9 botol', '12 botol'], c: 1 }
];

const qa = document.getElementById('quiz-area');
qs.forEach((q, i) => {
  let html = `<div class="card"><p style="font-weight:bold;font-size:1.15rem;margin-bottom:15px;color:var(--blue-dd)">${i+1}. ${q.q}</p>`;
  q.a.forEach((opt, j) => {
    html += `<div class="opt" data-q="${i}" data-a="${j}"><b style="color:var(--blue-d); width:25px; display:inline-block;">${['A','B','C'][j]}.</b> ${opt}</div>`;
  });
  html += `</div>`;
  qa.innerHTML += html;
});

let ans = {};
document.querySelectorAll('.opt').forEach(el => {
  el.addEventListener('click', function() {
    let qIdx = this.getAttribute('data-q');
    document.querySelectorAll(`.opt[data-q="${qIdx}"]`).forEach(o => o.classList.remove('sel'));
    this.classList.add('sel');
    ans[qIdx] = parseInt(this.getAttribute('data-a'));
  });
});

document.getElementById('submitBtn').addEventListener('click', () => {
  if(Object.keys(ans).length < 5) {
    alert('Hei Agen, ada soal yang belum kamu jawab tuh!');
    return;
  }
  
  let score = 0;
  qs.forEach((q, i) => { if(ans[i] === q.c) score += 20; });
  
  let passed = score >= 70;
  
  // Simpan ke Log LocalStorage
  let log = JSON.parse(localStorage.getItem('vml_c2_done_6_log') || '{"attempts":[],"bestScore":0}');
  log.attempts.push({score: score, date: new Date().toLocaleDateString('id-ID')});
  log.bestScore = Math.max(log.bestScore, score);
  log.passed = log.passed || passed;
  localStorage.setItem('vml_c2_done_6_log', JSON.stringify(log));
  if(passed) localStorage.setItem('vml_c2_done_6', '1');

  // Menampilkan Hasil
  document.getElementById('submitBtn').style.display = 'none';
  qa.style.display = 'none';
  document.getElementById('intro').style.display = 'none';
  
  const res = document.getElementById('result-area');
  res.style.display = 'block';
  document.getElementById('scoreTxt').innerText = score;
  document.getElementById('scoreTxt').style.color = passed ? '#10B981' : '#F43F5E';
  
  if(passed) {
    document.getElementById('msgTxt').innerText = 'Wow, Logikamu Tajam! Kamu LULUS KKM!';
    document.getElementById('msgTxt').style.color = '#065F46';
    document.getElementById('nextLvl').style.display = 'block';
    if(score === 100) document.getElementById('retryBtn').style.display = 'none';
  } else {
    document.getElementById('msgTxt').innerText = 'Waduh, belum mencapai KKM 70. Jangan lupa rumus Keep-Change-Flip (KCF)!';
    document.getElementById('msgTxt').style.color = '#9F1239';
  }
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
